name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Check formatting and lint
        run: ruff check --select E4,E7,E9,F src tests
