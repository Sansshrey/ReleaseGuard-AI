name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests and generate JUnit / coverage evidence
        run: pytest -q --junitxml=junit.xml --cov=releaseguard --cov-report=xml:coverage.xml
      - name: Upload ReleaseGuard test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: releaseguard-test-evidence
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Check formatting and lint
        run: ruff check --select E4,E7,E9,F src tests

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build ASP.NET Core gateway
        run: dotnet build dotnet/ReleaseGuard.Gateway/ReleaseGuard.Gateway.csproj --configuration Release
      - name: Build Azure Functions isolated worker
        run: dotnet build dotnet/ReleaseGuard.Functions/ReleaseGuard.Functions.csproj --configuration Release
